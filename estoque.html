<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque — Giro Certo Veículos</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-pagina="estoque">
<div id="cabecalho"></div>
<div class="topo"><div class="wrap" style="padding-top:40px;padding-bottom:28px"><h1>Estoque</h1><p>Filtre, busque e simule o financiamento do carro que você gostou.</p></div></div>
<section><div class="wrap">
  <div class="filtros" id="filtros">
    <a href="#" data-cat="todos" class="atual" onclick="return false">Todos</a>
    <a href="#" data-cat="hatch" onclick="return false">Hatch</a>
    <a href="#" data-cat="sedan" onclick="return false">Sedã</a>
    <a href="#" data-cat="suv" onclick="return false">SUV</a>
    <a href="#" data-cat="picape" onclick="return false">Picape</a>
  </div>
  <div class="caixa" style="margin-bottom:20px">
    <div class="linha-form">
      <div><label for="busca">Buscar pelo nome</label><input id="busca" placeholder="ex.: onix"></div>
      <div><label for="max">Preço máximo (R$)</label><input id="max" type="number" step="1000" min="0"></div>
    </div>
    <label for="ordem">Ordenar por</label>
    <select id="ordem"><option value="">Padrão</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="km">Menor km</option></select>
  </div>
  <p class="sub" id="contagem" style="margin:0 0 8px"></p>
  <div class="lista" id="lista"></div>
</div></section>
<div id="rodape"></div>
<script src="script.js"></script>
</body>
</html>
